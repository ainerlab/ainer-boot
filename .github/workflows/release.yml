name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to GitHub Packages
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify locked Maven 4 distribution
        run: ./mvnw --version

      - name: Configure GitHub Packages authentication
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<'SETTINGS'
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0 https://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>github-packages</id>
                <username>${env.GITHUB_ACTOR}</username>
                <password>${env.GITHUB_TOKEN}</password>
              </server>
            </servers>
          </settings>
          SETTINGS

      - name: Resolve release version from tag
        run: echo "release_version=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Import signing key
        if: vars.AINER_RELEASE_SIGNING == 'true'
        env:
          SIGNING_KEY_BASE64: ${{ secrets.AINER_GPG_KEY_BASE64 }}
          SIGNING_PASSPHRASE: ${{ secrets.AINER_GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          if [[ -z "${SIGNING_KEY_BASE64:-}" || -z "${SIGNING_PASSPHRASE:-}" ]]; then
            echo "AINER_RELEASE_SIGNING=true 但缺少 AINER_GPG_KEY_BASE64/AINER_GPG_PASSPHRASE，签名无法进行" >&2
            exit 1
          fi
          printenv SIGNING_KEY_BASE64 | base64 --decode > "$RUNNER_TEMP/signing.asc"
          gpg --batch --import "$RUNNER_TEMP/signing.asc"
          gpg --batch --yes --pinentry-mode loopback --passphrase "$SIGNING_PASSPHRASE" \
            --export-ownertrust >/dev/null
          echo "gpg_key_id=$(gpg --batch --with-colons --list-secret-keys | awk -F: '/^sec:/{print $5; exit}')" >> "$GITHUB_ENV"

      - name: Build, sign and publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_PASSPHRASE: ${{ secrets.AINER_GPG_PASSPHRASE }}
        run: |
          ARGS=(-Drevision="${{ env.release_version }}" -Prelease)
          if [[ "${AINER_RELEASE_SIGNING:-}" == "true" ]]; then
            ARGS+=(-Dgpg.keyname="$gpg_key_id" -Dgpg.passphrase="$SIGNING_PASSPHRASE")
          fi
          ./mvnw --batch-mode --no-transfer-progress "${ARGS[@]}" deploy

      - name: Attest build provenance
        uses: actions/attest-build-provenance@1c608d11d69870c2092266b3f9a6f3abbf17002c # v1.4.3
        with:
          subject-path: "**/target/*.jar"