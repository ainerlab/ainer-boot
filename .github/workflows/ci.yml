name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discipline:
    name: Commit discipline
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Check commit type and path discipline
        run: |
          if [ -n "${{ github.event.pull_request.base.sha }}" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          else
            base="$(git rev-list --max-parents=0 HEAD | head -1)"
          fi
          ./scripts/check-commit-discipline.sh "$base" HEAD

  quality:
    name: JDK 25 / Maven 4 quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify locked Maven 4 distribution
        run: ./mvnw --version

      - name: Verify shell, commercial docs and release workflow contracts
        run: ./scripts/check-release-contracts.sh

      - name: Verify runtime wiring contracts
        run: ./scripts/check-runtime-wiring.sh

      - name: Verify framework and product boundary
        run: ./scripts/check-framework-boundary.sh

      # 端点授权声明门禁：没有 @AinerAuthorize / @EndpointAccess 的 Controller 方法在运行期落到
      # anyRequest().authenticated()（即对所有已认证主体开放）。静态门禁与运行期
      # ainer.security.endpoint-authorization.mode=FAIL_CLOSED 是同一不变量的两层，缺一不可。
      - name: Verify endpoint authorization declarations
        run: ./scripts/check-endpoint-authorization.sh

      - name: Verify Docker runtime
        run: docker info

      - name: Run reactor verification
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Require zero failed, errored, or skipped tests
        run: ./scripts/check-surefire-results.sh

      # 容器路径真构建：静态门禁（check-runtime-wiring.sh）只能挡 COPY/模块漂移，基础镜像、
      # Maven Wrapper 分发格式、产物路径这类变化只有真跑 docker build 才会暴露
      # （2026-09-11 修复前该镜像从未构建成功过：COPY 漏 7 个模块、构建阶段缺 unzip 导致
      # wrapper 换成 .tar.gz 与固定校验和不符、Maven 4 help:evaluate 输出带前缀）。
      # 实测：本地 Colima 冷构建（--no-cache，62 步全过）15m01s、仅源码变更的增量重建 44s；镜像 147MB。
      - name: Build development Docker image
        timeout-minutes: 25
        run: |
          set -euo pipefail
          docker build --build-arg AINER_MODULE=ainer-server -t ainer-server:ci .
          docker run --rm --entrypoint sh ainer-server:ci -c '[ "$(id -u)" != "0" ] && [ -f /app/app.jar ]'
          docker image rm ainer-server:ci

      - name: Install locked Maven 3 consumer runtime
        env:
          MAVEN3_VERSION: 3.9.16
          MAVEN3_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apache-maven-$MAVEN3_VERSION-bin.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN3_VERSION/apache-maven-$MAVEN3_VERSION-bin.tar.gz"
          printf '%s  %s\n' "$MAVEN3_SHA512" "$archive" | sha512sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          printf 'MAVEN3_COMMAND=%s\n' \
            "$RUNNER_TEMP/apache-maven-$MAVEN3_VERSION/bin/mvn" >>"$GITHUB_ENV"

      - name: Verify Maven 3 and Maven 4 consumers
        run: ./scripts/verify-maven-consumers.sh

      - name: Verify initializer generation and consumer compilation
        run: ./scripts/verify-initializer-consumer.sh

      - name: Measure and gate TTFR
        run: ./scripts/measure-ttfr.sh

      - name: Measure and gate TTCRUD
        run: ./scripts/measure-ttcrud.sh

      - name: Generate CycloneDX SBOM artifact
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: ainer-boot-sbom.cdx.json
          dependency-snapshot: false
          upload-artifact: false
          upload-release-assets: false

      - name: Upload Surefire reports after failure
        if: failure()
        continue-on-error: true   # 存储配额不足不应掩盖测试结论
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP" >>"$GITHUB_PATH"
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact

  virtual-thread-matrix:
    name: Platform vs virtual thread matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven
      - name: Install Ainer artifacts to local repository
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests -Dgpg.skip=true install
      - name: Install ApacheBench
        timeout-minutes: 5
        run: sudo apt-get update && sudo apt-get install -y apache2-utils
      - name: Run platform vs virtual thread matrix
        run: ./scripts/measure-virtual-threads.sh -n 2000 -c 40 -d "$RUNNER_TEMP/vt-matrix"
      - name: Upload matrix artifacts
        continue-on-error: true   # 存储配额不应阻塞矩阵结论
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: virtual-thread-matrix
          path: "${{ runner.temp }}/vt-matrix/**"
          if-no-files-found: warn
          retention-days: 7
