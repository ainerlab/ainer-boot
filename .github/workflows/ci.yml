name: CI

on:
  pull_request:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: JDK 25 / Maven 4 quality gate
    runs-on: ubuntu-24.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify locked Maven 4 distribution
        run: ./mvnw --version

      - name: Verify Docker runtime
        run: docker info

      - name: Run reactor verification
        run: ./mvnw --batch-mode --no-transfer-progress clean verify

      - name: Require zero failed, errored, or skipped tests
        run: ./scripts/check-surefire-results.sh

      - name: Install locked Maven 3 consumer runtime
        env:
          MAVEN3_VERSION: 3.9.16
          MAVEN3_SHA512: 831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/apache-maven-$MAVEN3_VERSION-bin.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/$MAVEN3_VERSION/apache-maven-$MAVEN3_VERSION-bin.tar.gz"
          printf '%s  %s\n' "$MAVEN3_SHA512" "$archive" | sha512sum --check -
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          printf 'MAVEN3_COMMAND=%s\n' \
            "$RUNNER_TEMP/apache-maven-$MAVEN3_VERSION/bin/mvn" >>"$GITHUB_ENV"

      - name: Verify Maven 3 and Maven 4 consumers
        run: ./scripts/verify-maven-consumers.sh

      - name: Verify initializer generation and consumer compilation
        run: ./scripts/verify-initializer-consumer.sh

      - name: Measure and gate TTFR
        run: ./scripts/measure-ttfr.sh

      - name: Measure and gate TTCRUD
        run: ./scripts/measure-ttcrud.sh

      - name: Generate CycloneDX SBOM artifact
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: .
          format: cyclonedx-json
          artifact-name: ainer-boot-sbom.cdx.json
          dependency-snapshot: false
          upload-artifact: true
          upload-artifact-retention: 7
          upload-release-assets: false

      - name: Upload Surefire reports after failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: surefire-reports
          path: "**/target/surefire-reports/**"
          if-no-files-found: warn
          retention-days: 7

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --location --retry 3 \
            --output "$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf "$archive" -C "$RUNNER_TEMP"
          printf '%s\n' "$RUNNER_TEMP" >>"$GITHUB_PATH"
      - name: Run gitleaks
        run: gitleaks detect --source . --config .gitleaks.toml --no-banner --redact
