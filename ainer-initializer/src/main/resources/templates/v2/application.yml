spring:
  application:
    name: {{project.artifactId}}
  main:
    banner-mode: "off"
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATASOURCE_URL}
    username: ${DATASOURCE_USERNAME}
    password: ${DATASOURCE_PASSWORD}

ainer:
  security:
    resource-server:
      enabled: true
      public-paths:
        - /actuator/health

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
