schemaVersion: v1
project:
  name: CRUD Sample
  groupId: dev.ainer.consumer
  artifactId: crud-sample
  version: 1.0.0
spring-boot: 4.1.1
ainner: 0.1.0
java: 25
package: dev.ainer.consumer.crud
database: postgresql
owner:
  displayName: CRUD Team
  email: crud@example.com
entities:
  - name: product
    fields:
      - name: name
        type: string(64)
        comment: 产品名称
      - name: sku
        type: string(32)
        unique: true
        comment: 库存单位编码
      - name: price
        type: decimal
        nullable: true
      - name: active
        type: boolean
      - name: publishedAt
        type: instant
      - name: refId
        type: uuid