server {
  listen 80;
  server_name ainer-dev.xiaoqu99.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    try_files $uri =404;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl;
  http2 on;
  server_name ainer-dev.xiaoqu99.com;

  ssl_certificate /etc/letsencrypt/live/ainer-dev.xiaoqu99.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/ainer-dev.xiaoqu99.com/privkey.pem;
  server_tokens off;
  client_max_body_size 1m;

  location = / {
    return 302 /ainer-admin/;
  }

  location = /ainer-admin {
    return 308 /ainer-admin/;
  }

  location = /ainer-admin/index.html {
    alias /opt/ainer-admin/current/index.html;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    include /etc/nginx/security-headers.conf;
  }

  location ^~ /ainer-admin/assets/ {
    alias /opt/ainer-admin/current/assets/;
    limit_except GET HEAD { deny all; }
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    include /etc/nginx/security-headers.conf;
    access_log off;
  }

  location ^~ /ainer-admin/ {
    alias /opt/ainer-admin/current/;
    index index.html;
    try_files $uri $uri/ /ainer-admin/index.html;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-store" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    include /etc/nginx/security-headers.conf;
  }

  location = /ainer-studio {
    return 308 /ainer-studio/;
  }

  location ^~ /ainer-studio/assets/ {
    alias /opt/ainer-studio/current/assets/;
    limit_except GET HEAD { deny all; }
    expires 1y;
    add_header Cache-Control "public, immutable";
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    include /etc/nginx/security-headers.conf;
    access_log off;
  }

  location ^~ /ainer-studio/ {
    alias /opt/ainer-studio/current/;
    index index.html;
    try_files $uri $uri/ /ainer-studio/index.html;
    limit_except GET HEAD { deny all; }
    add_header Cache-Control "no-cache" always;
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
    include /etc/nginx/security-headers.conf;
  }

  location ^~ /.well-known/ {
    include /etc/nginx/snippets/ainer-boot-dev-proxy.conf;
  }

  location ^~ /oauth2/ {
    include /etc/nginx/snippets/ainer-boot-dev-proxy.conf;
  }

  location = /login {
    include /etc/nginx/snippets/ainer-boot-dev-proxy.conf;
  }

  location ^~ /login/ {
    include /etc/nginx/snippets/ainer-boot-dev-proxy.conf;
  }

  location = /ainer-login/tokens.css {
    include /etc/nginx/snippets/ainer-boot-dev-proxy.conf;
  }

  location = /ainer-login/login.css {
    include /etc/nginx/snippets/ainer-boot-dev-proxy.conf;
  }

  # 仅用于回滚到 M6 之前的 Spring Security 默认登录页。
  location = /default-ui.css {
    include /etc/nginx/snippets/ainer-boot-dev-proxy.conf;
  }

  location = /favicon.ico {
    limit_except GET HEAD { deny all; }
    access_log off;
    log_not_found off;
    return 204;
  }

  location = /error {
    include /etc/nginx/snippets/ainer-boot-dev-proxy.conf;
  }

  location = /connect/logout {
    include /etc/nginx/snippets/ainer-boot-dev-proxy.conf;
  }

  location = /api/me/access-token-revocations {
    include /etc/nginx/snippets/ainer-boot-dev-proxy.conf;
  }

  location / {
    return 404;
  }
}
