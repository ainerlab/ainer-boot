openapi: 3.0.4
info:
  title: Ainer Admin API
  version: 1.1.0
  description: |
    Ainer Admin 最小管理链路的 JSON API。OAuth/OIDC 登录、Token 交换和
    RP-Initiated Logout 使用标准协议端点，不由本契约生成自制协议客户端。
    TenantMembers 契约已随 ADR-0033 Greenfield 去 tenant 化删除，本版本只保留
    当前会话窄自助撤销。
servers:
  - url: /
    description: 与 Ainer Admin 同源的反向代理入口
tags:
  - name: CurrentSession
    description: 当前 USER bearer 的窄自助撤销
paths:
  /api/me/access-token-revocations:
    parameters:
      - $ref: '#/components/parameters/RequestId'
    post:
      tags:
        - CurrentSession
      operationId: revokeCurrentAccessToken
      summary: 撤销当前 USER bearer access token
      description: 不接受 token 请求参数，不能撤销其他 authorization。
      security:
        - ainerAdminOAuth: []
      responses:
        '200':
          description: 当前 access token 已撤销
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTokenRevocationApiResponse'
        '401':
          $ref: '#/components/responses/Unauthenticated'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/OnlineValidationUnavailable'
components:
  securitySchemes:
    ainerAdminOAuth:
      type: oauth2
      description: Authorization Code + PKCE S256；public client 不持有 client secret。
      flows:
        authorizationCode:
          authorizationUrl: /oauth2/authorize
          tokenUrl: /oauth2/token
          scopes:
            openid: 请求 OIDC ID Token
            profile: 请求基础用户身份投影
            workspace.read: 读取当前用户可访问的 Workspace 资源（保留供后续管理链路）
            workspace.write: 修改当前用户可访问的 Workspace 资源（保留供后续管理链路）
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: 可选的安全请求关联 ID；非法值由服务端重新生成。
      schema:
        type: string
        minLength: 1
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
  headers:
    RequestId:
      description: 服务端接受或生成的请求关联 ID。
      schema:
        type: string
  responses:
    Unauthenticated:
      description: access token 缺失、无效、过期或 inactive
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
    Forbidden:
      description: actor、scope 或资源角色不允许该操作
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
    OnlineValidationUnavailable:
      description: authorization 或 Identity 在线状态查询暂不可用
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
    InternalError:
      description: 服务端未预期失败
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorApiResponse'
  schemas:
    AccessTokenRevocation:
      type: object
      additionalProperties: false
      required:
        - revoked
      properties:
        revoked:
          type: boolean
          enum:
            - true
    AccessTokenRevocationApiResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
        - requestId
        - timestamp
      properties:
        code:
          type: string
          example: AINER.COMMON.OK
        message:
          type: string
          example: OK
        data:
          $ref: '#/components/schemas/AccessTokenRevocation'
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time
    ErrorApiResponse:
      type: object
      additionalProperties: false
      required:
        - code
        - message
        - data
        - requestId
        - timestamp
      properties:
        code:
          type: string
          example: AINER.COMMON.UNAUTHENTICATED
        message:
          type: string
        data:
          nullable: true
        requestId:
          type: string
        timestamp:
          type: string
          format: date-time