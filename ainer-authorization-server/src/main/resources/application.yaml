spring:
  application:
    name: ainer-authorization-server
  main:
    allow-circular-references: false
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${AINER_AUTHORIZATION_SERVER_PORT:9000}
  shutdown: graceful

ainer:
  admin:
    browser-client:
      enabled: ${AINER_ADMIN_BROWSER_CLIENT_ENABLED:false}
      redirect-uri: ${AINER_ADMIN_BROWSER_CLIENT_REDIRECT_URI:}
      post-logout-redirect-uri: ${AINER_ADMIN_BROWSER_CLIENT_POST_LOGOUT_REDIRECT_URI:}
    dev-bootstrap:
      enabled: ${AINER_ADMIN_DEV_BOOTSTRAP_ENABLED:false}
      owner-username: ${AINER_ADMIN_DEV_OWNER_USERNAME:}
      owner-password: ${AINER_ADMIN_DEV_OWNER_PASSWORD:}
      owner-display-name: ${AINER_ADMIN_DEV_OWNER_DISPLAY_NAME:}
      member-username: ${AINER_ADMIN_DEV_MEMBER_USERNAME:}
      member-password: ${AINER_ADMIN_DEV_MEMBER_PASSWORD:}
      member-display-name: ${AINER_ADMIN_DEV_MEMBER_DISPLAY_NAME:}
  identity:
    enabled: ${AINER_IDENTITY_ENABLED:true}
    directory-api:
      enabled: ${AINER_IDENTITY_DIRECTORY_API_ENABLED:false}
    access-event-relay:
      enabled: ${AINER_IDENTITY_ACCESS_EVENT_RELAY_ENABLED:false}
      workspace-base-url: ${AINER_IDENTITY_ACCESS_EVENT_WORKSPACE_BASE_URL:}
      token-uri: ${AINER_IDENTITY_ACCESS_EVENT_TOKEN_URI:}
      client-id: ${AINER_IDENTITY_ACCESS_EVENT_CLIENT_ID:}
      client-secret: ${AINER_IDENTITY_ACCESS_EVENT_CLIENT_SECRET:}
      scope: ${AINER_IDENTITY_ACCESS_EVENT_SCOPE:identity.access-events.publish}
      allow-insecure-http: ${AINER_IDENTITY_ACCESS_EVENT_ALLOW_INSECURE_HTTP:false}
      fixed-delay: ${AINER_IDENTITY_ACCESS_EVENT_FIXED_DELAY:5s}
      lease-duration: ${AINER_IDENTITY_ACCESS_EVENT_LEASE_DURATION:30s}
      retry-delay: ${AINER_IDENTITY_ACCESS_EVENT_RETRY_DELAY:30s}
      max-attempts: ${AINER_IDENTITY_ACCESS_EVENT_MAX_ATTEMPTS:10}
      batch-size: ${AINER_IDENTITY_ACCESS_EVENT_BATCH_SIZE:50}
    access-event-recovery:
      enabled: ${AINER_IDENTITY_ACCESS_EVENT_RECOVERY_ENABLED:false}
      approval-ttl: ${AINER_IDENTITY_ACCESS_EVENT_RECOVERY_APPROVAL_TTL:15m}
      max-attempts: ${AINER_IDENTITY_ACCESS_EVENT_MAX_ATTEMPTS:10}
    platform-control:
      enabled: ${AINER_IDENTITY_PLATFORM_CONTROL_ENABLED:false}
      operator-client-ids: ${AINER_IDENTITY_PLATFORM_CONTROL_OPERATOR_CLIENT_IDS:}
      request-ttl: ${AINER_IDENTITY_PLATFORM_CONTROL_REQUEST_TTL:7d}
      activation-ttl: ${AINER_IDENTITY_PLATFORM_CONTROL_ACTIVATION_TTL:24h}
      activation-max-attempts: ${AINER_IDENTITY_PLATFORM_CONTROL_ACTIVATION_MAX_ATTEMPTS:5}
      notification-protection-active-key-version: ${AINER_IDENTITY_NOTIFICATION_ACTIVE_KEY_VERSION:}
      notification-protection-keys: ${AINER_IDENTITY_NOTIFICATION_PROTECTION_KEYS:}
    provisioning-notification-relay:
      enabled: ${AINER_IDENTITY_PROVISIONING_NOTIFICATION_RELAY_ENABLED:false}
      gateway-uri: ${AINER_IDENTITY_PROVISIONING_NOTIFICATION_GATEWAY_URI:}
      token-uri: ${AINER_IDENTITY_PROVISIONING_NOTIFICATION_TOKEN_URI:}
      client-id: ${AINER_IDENTITY_PROVISIONING_NOTIFICATION_CLIENT_ID:}
      client-secret: ${AINER_IDENTITY_PROVISIONING_NOTIFICATION_CLIENT_SECRET:}
      scope: ${AINER_IDENTITY_PROVISIONING_NOTIFICATION_SCOPE:identity.provisioning-notifications.publish}
      allow-insecure-http: ${AINER_IDENTITY_PROVISIONING_NOTIFICATION_ALLOW_INSECURE_HTTP:false}
      fixed-delay: ${AINER_IDENTITY_PROVISIONING_NOTIFICATION_FIXED_DELAY:5s}
      lease-duration: ${AINER_IDENTITY_PROVISIONING_NOTIFICATION_LEASE_DURATION:30s}
      retry-delay: ${AINER_IDENTITY_PROVISIONING_NOTIFICATION_RETRY_DELAY:30s}
      max-attempts: ${AINER_IDENTITY_PROVISIONING_NOTIFICATION_MAX_ATTEMPTS:10}
      batch-size: ${AINER_IDENTITY_PROVISIONING_NOTIFICATION_BATCH_SIZE:50}
    provisioning-notification-receipts:
      enabled: ${AINER_IDENTITY_PROVISIONING_NOTIFICATION_RECEIPTS_ENABLED:false}
      gateway-client-ids: ${AINER_IDENTITY_PROVISIONING_NOTIFICATION_RECEIPT_GATEWAY_CLIENT_IDS:}
  platform:
    tenant-bootstrap:
      enabled: ${AINER_PLATFORM_TENANT_BOOTSTRAP_ENABLED:false}
      tenant-code: ${AINER_PLATFORM_TENANT_BOOTSTRAP_TENANT_CODE:}
      tenant-name: ${AINER_PLATFORM_TENANT_BOOTSTRAP_TENANT_NAME:}
      username: ${AINER_PLATFORM_TENANT_BOOTSTRAP_USERNAME:}
      password: ${AINER_PLATFORM_TENANT_BOOTSTRAP_PASSWORD:}
      display-name: ${AINER_PLATFORM_TENANT_BOOTSTRAP_DISPLAY_NAME:}
  security:
    authorization-server:
      issuer: ${AINER_AUTHORIZATION_SERVER_ISSUER:}
      audience: ${AINER_AUTHORIZATION_SERVER_AUDIENCE:ainer-api}
      signing-key:
        key-id: ${AINER_AUTHORIZATION_SIGNING_KEY_ID:}
        private-key-location: ${AINER_AUTHORIZATION_PRIVATE_KEY_LOCATION:}
        public-key-location: ${AINER_AUTHORIZATION_PUBLIC_KEY_LOCATION:}
      passkey:
        enabled: ${AINER_AUTHORIZATION_PASSKEY_ENABLED:false}
        rp-id: ${AINER_AUTHORIZATION_PASSKEY_RP_ID:}
        rp-name: ${AINER_AUTHORIZATION_PASSKEY_RP_NAME:Ainer}
        allowed-origins: ${AINER_AUTHORIZATION_PASSKEY_ALLOWED_ORIGINS:}
        allow-insecure-http: ${AINER_AUTHORIZATION_PASSKEY_ALLOW_INSECURE_HTTP:false}
        ceremony-timeout: ${AINER_AUTHORIZATION_PASSKEY_CEREMONY_TIMEOUT:5m}
        recovery:
          enabled: ${AINER_AUTHORIZATION_PASSKEY_RECOVERY_ENABLED:false}
          self-service-enabled: ${AINER_AUTHORIZATION_PASSKEY_SELF_RECOVERY_ENABLED:false}
          approval-ttl: ${AINER_AUTHORIZATION_PASSKEY_RECOVERY_APPROVAL_TTL:15m}
        enrollment:
          mode: ${AINER_AUTHORIZATION_PASSKEY_ENROLLMENT_MODE:optional}
      login-rate-limit:
        enabled: ${AINER_AUTHORIZATION_LOGIN_RATE_LIMIT_ENABLED:false}
        window: ${AINER_AUTHORIZATION_LOGIN_RATE_LIMIT_WINDOW:1m}
        max-requests: ${AINER_AUTHORIZATION_LOGIN_RATE_LIMIT_MAX_REQUESTS:20}
        paths: ${AINER_AUTHORIZATION_LOGIN_RATE_LIMIT_PATHS:/login,/login/webauthn,/webauthn/authenticate/options}
      machine-client-bootstrap:
        enabled: ${AINER_AUTHORIZATION_BOOTSTRAP_MACHINE_ENABLED:false}
        client-id: ${AINER_AUTHORIZATION_BOOTSTRAP_MACHINE_CLIENT_ID:}
        client-secret: ${AINER_AUTHORIZATION_BOOTSTRAP_MACHINE_CLIENT_SECRET:}
        tenant-id: ${AINER_AUTHORIZATION_BOOTSTRAP_MACHINE_TENANT_ID:}
        scopes: ${AINER_AUTHORIZATION_BOOTSTRAP_MACHINE_SCOPES:ai.invoke}
      introspection-client-bootstrap:
        enabled: ${AINER_AUTHORIZATION_BOOTSTRAP_INTROSPECTION_ENABLED:false}
        client-id: ${AINER_AUTHORIZATION_BOOTSTRAP_INTROSPECTION_CLIENT_ID:}
        client-secret: ${AINER_AUTHORIZATION_BOOTSTRAP_INTROSPECTION_CLIENT_SECRET:}
      metrics-client-bootstrap:
        enabled: ${AINER_AUTHORIZATION_BOOTSTRAP_METRICS_ENABLED:false}
        client-id: ${AINER_AUTHORIZATION_BOOTSTRAP_METRICS_CLIENT_ID:}
        client-secret: ${AINER_AUTHORIZATION_BOOTSTRAP_METRICS_CLIENT_SECRET:}
      client-control-operator-bootstrap:
        enabled: ${AINER_AUTHORIZATION_BOOTSTRAP_CLIENT_CONTROL_OPERATOR_ENABLED:false}
        client-id: ${AINER_AUTHORIZATION_BOOTSTRAP_CLIENT_CONTROL_OPERATOR_CLIENT_ID:}
        client-secret: ${AINER_AUTHORIZATION_BOOTSTRAP_CLIENT_CONTROL_OPERATOR_CLIENT_SECRET:}
      platform-identity-operator-bootstrap:
        enabled: ${AINER_AUTHORIZATION_BOOTSTRAP_PLATFORM_IDENTITY_OPERATOR_ENABLED:false}
        client-id: ${AINER_AUTHORIZATION_BOOTSTRAP_PLATFORM_IDENTITY_OPERATOR_CLIENT_ID:}
        client-secret: ${AINER_AUTHORIZATION_BOOTSTRAP_PLATFORM_IDENTITY_OPERATOR_CLIENT_SECRET:}
      provisioning-notification-relay-client-bootstrap:
        enabled: ${AINER_AUTHORIZATION_BOOTSTRAP_PROVISIONING_NOTIFICATION_RELAY_ENABLED:false}
        client-id: ${AINER_AUTHORIZATION_BOOTSTRAP_PROVISIONING_NOTIFICATION_RELAY_CLIENT_ID:}
        client-secret: ${AINER_AUTHORIZATION_BOOTSTRAP_PROVISIONING_NOTIFICATION_RELAY_CLIENT_SECRET:}
      provisioning-notification-receipt-client-bootstrap:
        enabled: ${AINER_AUTHORIZATION_BOOTSTRAP_PROVISIONING_NOTIFICATION_RECEIPT_ENABLED:false}
        client-id: ${AINER_AUTHORIZATION_BOOTSTRAP_PROVISIONING_NOTIFICATION_RECEIPT_CLIENT_ID:}
        client-secret: ${AINER_AUTHORIZATION_BOOTSTRAP_PROVISIONING_NOTIFICATION_RECEIPT_CLIENT_SECRET:}
      client-control:
        enabled: ${AINER_AUTHORIZATION_CLIENT_CONTROL_ENABLED:false}
        operator-client-ids: ${AINER_AUTHORIZATION_CLIENT_CONTROL_OPERATOR_CLIENT_IDS:}
        allowed-scopes: ${AINER_AUTHORIZATION_CLIENT_CONTROL_ALLOWED_SCOPES:ai.invoke}
        access-token-ttl: ${AINER_AUTHORIZATION_CLIENT_CONTROL_ACCESS_TOKEN_TTL:5m}
        client-secret-ttl: ${AINER_AUTHORIZATION_CLIENT_CONTROL_CLIENT_SECRET_TTL:90d}
        secret-bytes: ${AINER_AUTHORIZATION_CLIENT_CONTROL_SECRET_BYTES:32}

mybatis:
  mapper-locations: classpath*:/mapper/**/*.xml
  configuration:
    map-underscore-to-camel-case: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
